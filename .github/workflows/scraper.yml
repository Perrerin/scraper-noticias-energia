name: Executar Scraper de Noticias

on:
  schedule:
    # Sintaxis Cron: Minuto Hora Día-del-mes Mes Día-de-la-semana (1 = Lunes)
    # GitHub Actions usa la hora UTC. Ajusta la hora según tu zona horaria.
    - cron: '0 14 * * 1' # Ejemplo: 14:00 UTC = 9:00 AM en Colombia/Perú/Panamá (UTC-5)
  workflow_dispatch: # Permite ejecutar el script manualmente desde la web de GitHub para probar

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Otorga permisos para guardar los cambios de noticias_master.csv en el repo

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el scraper
        run: python scraper-noticias.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias_master.csv
          git diff-index --quiet HEAD || git commit -m "bot: actualización automática de noticias_master.csv"
          git push
