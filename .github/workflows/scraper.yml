name: Actualizar noticias

on:
  schedule:
    - cron: "0 11,17,23 * * *"   # 6:00, 12:00 y 18:00 hora Colombia (cron va en UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scraper-noticias.py
        env:
          ZONA_HORARIA: America/Bogota
          DIAS_ATRAS: "7"

      - name: Subir archivo maestro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add noticias_master.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en el archivo maestro"
            exit 0
          fi
          git commit -m "Actualiza noticias $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
